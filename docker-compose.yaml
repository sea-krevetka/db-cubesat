version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: cubesat_postgres
    environment:
      POSTGRES_USER: cubesat_admin
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: cubesat_monitoring
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./data.sql:/docker-entrypoint-initdb.d/02_data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cubesat_admin -d cubesat_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cubesat_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cubesat_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cubesat.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - cubesat_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  cubesat_network:
    driver: bridge